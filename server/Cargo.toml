[package]
name = "server"
version = "0.1.0"
edition.workspace = true
# приложение, а не библиотека: в crates.io не публикуется
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
argon2 = "0.5.3"
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
# чтение xlsx/xls: чистый Rust, без внешних утилит и без Excel на сервере
calamine = "0.36.1"
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
governor = "0.10.4"
hex = "0.4.3"
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
lettre = { version = "0.11.22", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros", "time", "uuid"] }
time = { version = "0.3.54", features = ["serde", "formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
totp-rs = { version = "5.7.2", features = ["gen_secret", "otpauth"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "request-id", "timeout", "util"] }
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unic-langid = { version = "0.9.6", features = ["macros"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "time"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
# каталог файлов на тест: TempDir сам стирает его при завершении теста
tempfile = "3.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
totp-rs = { version = "5.7.2", features = ["gen_secret", "otpauth"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.24.0", features = ["v4"] }
