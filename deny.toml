# Проверка цепочки поставки Rust-зависимостей: известные уязвимости, лицензии,
# источники. Запускается в CI (нужна сеть), локальный `make verify` — офлайн.
# Отдельный cargo-audit не ставим: его база — те же advisories, что ниже.

[advisories]
version = 2
yanked = "deny"
# Пусто и должно оставаться пустым: уязвимость чинится обновлением, а не
# записью сюда. Если исключение всё же нужно — рядом строка «почему не
# страшно и когда уйдёт».
ignore = []

[licenses]
version = 2
# Разрешаем только то, что реально встречается в графе и не требует раскрытия
# исходников. Новая лицензия = осознанное решение, а не молчаливое согласие.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    # webpki-roots — набор корневых сертификатов, лицензия данных
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# Само приложение не публикуется в crates.io и лицензии не имеет
ignore = true

[bans]
# Две версии одной библиотеки — лишний вес бинаря, но пока не повод падать
multiple-versions = "warn"
# Зависимость без верхней границы версии однажды приедет сломанной
wildcards = "deny"

[sources]
# Пакет из неизвестного реестра или git-ветки — самый простой способ
# протащить чужой код в прод
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
